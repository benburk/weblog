{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ page.title }}</h1>
{{ page.content | safe }}
<ul class="posts projects">
  {% for project in page.extra.projects %}
  <li><span>{{ project.name }}</span><span>{{ project.tagline }}</span></li>
  {% endfor %}
</ul>
{% endblock %}
