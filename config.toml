base_url = "https://weblog.example"
title = "weblog"
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
# Code stays ink on the inset ground, as paper.css draws it.
smart_punctuation = false

[markdown.highlighting]
# Class mode, so code is coloured by paper.css and follows the light/dark
# switch. syntax/paper.json links papercss's theme, which only decides which
# scopes get a class of their own; the colours zola writes to
# static/giallo.css go unused.
style = "class"
theme = "paper"
extra_themes = ["syntax/paper.json"]
# Custom languages: drop a TextMate grammar (JSON) in syntax/, list it here,
# and fence code with the grammar's `name`.
extra_grammars = []
